<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 580" width="520" height="580">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>

  <rect x="60" y="20" width="400" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="260" y="50" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">128 Mbit SPI NOR Flash</text>
  <text x="260" y="70" text-anchor="middle" font-family="Arial" font-size="13">16 MiB total (16,777,216 bytes)</text>

  <line x1="260" y1="90" x2="260" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="275" y="115" font-family="Arial" font-size="12" fill="#333">÷ 256</text>

  <rect x="60" y="135" width="400" height="70" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="260" y="165" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">256 Blocks × 64 KB</text>
  <text x="260" y="185" text-anchor="middle" font-family="Arial" font-size="13">Block index = A[23:16]</text>

  <line x1="260" y1="205" x2="260" y2="245" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="275" y="230" font-family="Arial" font-size="12" fill="#333">÷ 16</text>

  <rect x="60" y="250" width="400" height="70" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="260" y="280" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">16 Sectors × 4 KB (per block)</text>
  <text x="260" y="300" text-anchor="middle" font-family="Arial" font-size="13">Sector index = A[15:12]</text>

  <line x1="260" y1="320" x2="260" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="275" y="345" font-family="Arial" font-size="12" fill="#333">÷ 16</text>

  <rect x="60" y="365" width="400" height="70" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="260" y="395" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">16 Pages × 256 B (per sector)</text>
  <text x="260" y="415" text-anchor="middle" font-family="Arial" font-size="13">Page index = A[11:8]</text>

  <line x1="260" y1="435" x2="260" y2="475" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="275" y="460" font-family="Arial" font-size="12" fill="#333">÷ 256</text>

  <rect x="60" y="480" width="400" height="70" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="260" y="510" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">256 Bytes (per page)</text>
  <text x="260" y="530" text-anchor="middle" font-family="Arial" font-size="13">Byte offset = A[7:0]</text>
</svg>