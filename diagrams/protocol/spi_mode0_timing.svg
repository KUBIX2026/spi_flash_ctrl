<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  
  <!-- Título -->
  <text x="400" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">SPI Mode 0 (CPOL=0, CPHA=0) — Bit Transfer Timing</text>

  <!-- Etiquetas de las señales -->
  <text x="15" y="75" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">CS</text>
  <text x="15" y="160" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">SCLK</text>
  <text x="15" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">MOSI</text>
  <text x="15" y="335" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">MISO</text>

  <!-- Líneas verticales de tiempo (dibujadas primero para quedar en el fondo) -->
  <!-- Líneas de muestreo (rojo punteado) -->
  <line x1="200" y1="45" x2="200" y2="360" stroke="#e74c3c" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="320" y1="45" x2="320" y2="360" stroke="#e74c3c" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="440" y1="45" x2="440" y2="360" stroke="#e74c3c" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="560" y1="45" x2="560" y2="360" stroke="#e74c3c" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Líneas de cambio (verde sólido) -->
  <line x1="260" y1="45" x2="260" y2="360" stroke="#27ae60" stroke-width="1"/>
  <line x1="380" y1="45" x2="380" y2="360" stroke="#27ae60" stroke-width="1"/>
  <line x1="500" y1="45" x2="500" y2="360" stroke="#27ae60" stroke-width="1"/>

  <!-- Señal CS -->
  <path d="M90,55 L140,55 L140,85 L620,85 L620,55 L720,55" fill="none" stroke="#333" stroke-width="2"/>
  <text x="115" y="48" font-family="Arial, sans-serif" font-size="10" fill="#666">HIGH (idle)</text>
  <text x="350" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">LOW → device selected</text>

  <!-- Señal SCLK -->
  <path d="M90,170 L200,170 L200,140 L260,140 L260,170 L320,170 L320,140 L380,140 L380,170 L440,170 L440,140 L500,140 L500,170 L560,170 L560,140 L620,140 L620,170 L720,170" fill="none" stroke="#333" stroke-width="2"/>
  <text x="110" y="188" font-family="Arial, sans-serif" font-size="10" fill="#666">idle low (CPOL=0)</text>

  <!-- Anotaciones de flancos (centradas en las líneas) -->
  <text x="200" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">▲ leading</text>
  <text x="260" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">▼ trailing</text>

  <!-- Datos MOSI (se dibujan después de las líneas para taparlas) -->
  <rect x="140" y="220" width="120" height="30" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
  <text x="200" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">D7</text>
  
  <rect x="260" y="220" width="120" height="30" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
  <text x="320" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">D6</text>
  
  <rect x="380" y="220" width="120" height="30" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
  <text x="440" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">D5</text>
  
  <rect x="500" y="220" width="120" height="30" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
  <text x="560" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">D4</text>

  <!-- Datos MISO (se dibujan después de las líneas para taparlas) -->
  <rect x="140" y="310" width="120" height="30" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="200" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">D7</text>
  
  <rect x="260" y="310" width="120" height="30" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="320" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">D6</text>
  
  <rect x="380" y="310" width="120" height="30" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="440" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">D5</text>
  
  <rect x="500" y="310" width="120" height="30" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="560" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">D4</text>

  <!-- Leyenda inferior -->
  <line x1="100" y1="400" x2="140" y2="400" stroke="#e74c3c" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="150" y="404" font-family="Arial, sans-serif" font-size="11" fill="#333">Sample edge (rising, leading): data is stable and read</text>

  <line x1="100" y1="425" x2="140" y2="425" stroke="#27ae60" stroke-width="1"/>
  <text x="150" y="429" font-family="Arial, sans-serif" font-size="11" fill="#333">Change edge (falling, trailing): data transitions to next bit</text>

  <!-- Notas finales -->
  <text x="400" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#666">MSB first: D7 → D6 → D5 → D4 …</text>
  <text x="400" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">First bit (D7) must be valid BEFORE the first rising edge (t=200)</text>
  
</svg>