<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%">
  
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .box-title { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .box-sub { font-family: 'Arial', sans-serif; font-size: 11px; fill: #666; }
      .box-detail { font-family: 'Arial', sans-serif; font-size: 10px; fill: #999; }
      .bus-title { font-family: 'Arial', sans-serif; font-size: 11px; font-weight: bold; fill: #333; }
      .bus-signal { font-family: 'Arial', sans-serif; font-size: 10px; fill: #555; }
      .footer-text { font-family: 'Arial', sans-serif; font-size: 10px; font-style: italic; fill: #666; }
    </style>
    
    <!-- Marcador de flecha derecha -->
    <marker id="arrowEnd" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <!-- Marcador de flecha izquierda -->
    <marker id="arrowStart" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Título -->
  <text x="400" y="26" text-anchor="middle" class="title">System context — where the controller sits</text>

  <!-- Caja 1: FemtoRV32 SoC -->
  <rect x="30" y="80" width="180" height="100" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="120" y="120" text-anchor="middle" class="box-title">FemtoRV32 SoC</text>
  <text x="120" y="140" text-anchor="middle" class="box-sub">(black box)</text>
  <text x="120" y="160" text-anchor="middle" class="box-detail">CPU + decoder + buses</text>

  <!-- Caja 2: SPI-Flash Controller -->
  <rect x="300" y="80" width="200" height="100" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="400" y="120" text-anchor="middle" class="box-title">SPI-Flash Controller</text>
  <text x="400" y="140" text-anchor="middle" class="box-sub">(this peripheral)</text>
  <text x="400" y="160" text-anchor="middle" class="box-detail">CSR + SPI master FSM</text>

  <!-- Caja 3: W25Q128JV -->
  <rect x="590" y="80" width="180" height="100" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="680" y="120" text-anchor="middle" class="box-title">W25Q128JV</text>
  <text x="680" y="140" text-anchor="middle" class="box-sub">(SPI NOR Flash)</text>
  <text x="680" y="160" text-anchor="middle" class="box-detail">external device</text>

  <!-- Bus 1: mem bus (SoC <-> Controller) -->
  <line x1="210" y1="130" x2="300" y2="130" stroke="#333" stroke-width="2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="255" y="115" text-anchor="middle" class="bus-title">mem bus</text>
  <text x="255" y="150" text-anchor="middle" class="bus-signal">d_in / cs / addr</text>
  <text x="255" y="165" text-anchor="middle" class="bus-signal">rd / wr / d_out</text>

  <!-- Bus 2: SPI (Controller <-> Flash) -->
  <line x1="500" y1="130" x2="590" y2="130" stroke="#333" stroke-width="2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="545" y="115" text-anchor="middle" class="bus-title">SPI</text>
  <text x="545" y="150" text-anchor="middle" class="bus-signal">SCLK</text>
  <text x="545" y="165" text-anchor="middle" class="bus-signal">MOSI / MISO</text>
  <text x="545" y="180" text-anchor="middle" class="bus-signal">CS</text>

  <!-- Nota final -->
  <text x="400" y="230" text-anchor="middle" class="footer-text">Base address 0x420000, span 0x420000–0x42FFFF. Single cs[i] line from the decoder.</text>
  
</svg>