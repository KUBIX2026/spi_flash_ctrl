<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
      .box-text-main { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #111; }
      .box-text-sub { font-family: 'Arial', sans-serif; font-size: 12px; fill: #222; }
      .sub-text { font-family: 'Arial', sans-serif; font-size: 13px; fill: #222; }
      .footer-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #333; }
      .box-stroke { stroke: #333; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Título -->
  <text x="450" y="30" text-anchor="middle" class="title">24-bit Flash Address (A[23:0])</text>

  <!-- Contenedor principal (Fondo) -->
  <g>
    <!-- Bloque 1: A[23:16] -->
    <rect x="50" y="60" width="260" height="65" fill="#d9ead3" class="box-stroke" />
    <text x="180" y="85" text-anchor="middle" class="box-text-main">A[23:16]</text>
    <text x="180" y="107" text-anchor="middle" class="box-text-sub">8 bits — Block</text>

    <!-- Bloque 2: A[15:12] -->
    <rect x="310" y="60" width="145" height="65" fill="#fce5cd" class="box-stroke" />
    <text x="382.5" y="85" text-anchor="middle" class="box-text-main">A[15:12]</text>
    <text x="382.5" y="107" text-anchor="middle" class="box-text-sub">4 bits — Sector</text>

    <!-- Bloque 3: A[11:8] -->
    <rect x="455" y="60" width="145" height="65" fill="#fff2cc" class="box-stroke" />
    <text x="527.5" y="85" text-anchor="middle" class="box-text-main">A[11:8]</text>
    <text x="527.5" y="107" text-anchor="middle" class="box-text-sub">4 bits — Page</text>

    <!-- Bloque 4: A[7:0] -->
    <rect x="600" y="60" width="250" height="65" fill="#f4cccc" class="box-stroke" />
    <text x="725" y="85" text-anchor="middle" class="box-text-main">A[7:0]</text>
    <text x="725" y="107" text-anchor="middle" class="box-text-sub">8 bits — Byte offset</text>
  </g>

  <!-- Textos inferiores (Corregidos para evitar superposición) -->
  <g class="sub-text">
    <!-- Centrados exactamente debajo de cada bloque -->
    <text x="180" y="150" text-anchor="middle">256 values (64 KB each)</text>
    <text x="382.5" y="150" text-anchor="middle">16 values (4 KB each)</text>
    <text x="527.5" y="150" text-anchor="middle">16 values (256 B each)</text>
    <text x="725" y="150" text-anchor="middle">256 values (1 byte each)</text>
  </g>

  <!-- Texto de pie de página -->
  <g class="footer-text">
    <text x="450" y="220" text-anchor="middle" font-style="italic">Total: 256 × 16 × 16 × 256 = 16,777,216 bytes = 16 MiB</text>
    <text x="450" y="260" text-anchor="middle">MSB first on the SPI bus: A23 is transmitted first, A0 last</text>
  </g>
</svg>