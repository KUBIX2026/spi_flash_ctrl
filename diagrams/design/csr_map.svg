<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .window-text { font-family: 'Arial', sans-serif; font-size: 11px; fill: #666; }
      .reg-name { font-family: 'Arial', sans-serif; font-size: 12px; font-weight: bold; fill: #333; }
      .reg-offset { font-family: 'Arial', sans-serif; font-size: 10px; fill: #666; }
      .axis-label { font-family: 'Arial', sans-serif; font-size: 10px; fill: #333; }
      .summary-title { font-family: 'Arial', sans-serif; font-size: 12px; font-weight: bold; fill: #333; }
      .summary-text { font-family: 'Arial', sans-serif; font-size: 11px; fill: #333; }
      .footer-text { font-family: 'Arial', sans-serif; font-size: 9px; font-style: italic; fill: #666; }
    </style>
  </defs>

  <!-- Título -->
  <text x="450" y="28" text-anchor="middle" class="title">Register map — base 0x420000, span 0x420000–0x42FFFF</text>

  <!-- Ventana de 64 KB -->
  <rect x="40" y="60" width="820" height="60" fill="#f5f5f5" stroke="#999" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="450" y="48" text-anchor="middle" class="window-text">64 KB window (only first 0x18 bytes are implemented)</text>

  <!-- Registros -->
  <!-- CTRL -->
  <rect x="60" y="70" width="120" height="40" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="120" y="85" text-anchor="middle" class="reg-name">CTRL</text>
  <text x="120" y="100" text-anchor="middle" class="reg-offset">0x00</text>

  <!-- STATUS -->
  <rect x="190" y="70" width="120" height="40" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="250" y="85" text-anchor="middle" class="reg-name">STATUS</text>
  <text x="250" y="100" text-anchor="middle" class="reg-offset">0x04</text>

  <!-- ADDR -->
  <rect x="320" y="70" width="120" height="40" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="380" y="85" text-anchor="middle" class="reg-name">ADDR</text>
  <text x="380" y="100" text-anchor="middle" class="reg-offset">0x08</text>

  <!-- DATA -->
  <rect x="450" y="70" width="120" height="40" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="510" y="85" text-anchor="middle" class="reg-name">DATA</text>
  <text x="510" y="100" text-anchor="middle" class="reg-offset">0x0C</text>

  <!-- LEN -->
  <rect x="580" y="70" width="120" height="40" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="640" y="85" text-anchor="middle" class="reg-name">LEN</text>
  <text x="640" y="100" text-anchor="middle" class="reg-offset">0x10</text>

  <!-- CFG -->
  <rect x="710" y="70" width="120" height="40" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="770" y="85" text-anchor="middle" class="reg-name">CFG</text>
  <text x="770" y="100" text-anchor="middle" class="reg-offset">0x14</text>

  <!-- Eje de direcciones (Líneas y etiquetas centradas) -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="120" y1="150" x2="120" y2="175" />
    <line x1="250" y1="150" x2="250" y2="175" />
    <line x1="380" y1="150" x2="380" y2="175" />
    <line x1="510" y1="150" x2="510" y2="175" />
    <line x1="640" y1="150" x2="640" y2="175" />
    <line x1="770" y1="150" x2="770" y2="175" />
  </g>

  <g class="axis-label" text-anchor="middle">
    <text x="120" y="190">0x00</text>
    <text x="250" y="190">0x04</text>
    <text x="380" y="190">0x08</text>
    <text x="510" y="190">0x0C</text>
    <text x="640" y="190">0x10</text>
    <text x="770" y="190">0x14</text>
  </g>

  <!-- Línea horizontal punteada -->
  <line x1="120" y1="175" x2="770" y2="175" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Resumen de acceso -->
  <rect x="60" y="210" width="770" height="140" fill="#fafafa" stroke="#999" stroke-width="1"/>
  <text x="445" y="232" text-anchor="middle" class="summary-title">Access summary</text>

  <text x="90" y="258" class="summary-text">Write-only:  CTRL, ADDR, LEN, CFG</text>
  <text x="90" y="280" class="summary-text">Read-only:   STATUS</text>
  <text x="90" y="302" class="summary-text">Read/write:  DATA (TX FIFO on write, RX FIFO on read)</text>
  <text x="90" y="324" class="summary-text">Reserved:    offsets 0x18–0xFFFF read as zero, writes ignored</text>

  <!-- Nota final -->
  <text x="450" y="368" text-anchor="middle" class="footer-text">All registers are 32-bit, word-aligned. Byte accesses are not supported.</text>
  
</svg>